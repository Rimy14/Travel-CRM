<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amja Travels - Hajj & Umrah CRM</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-info">
            <h2>Amja Travels</h2>
            <span>Hajj & Umrah CRM</span>
          </div>
        </div>

        <nav class="sidebar-menu">
          <button class="nav-item active" data-view="dashboard">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </button>
          <button class="nav-item" data-view="customers">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </span>
            <span class="nav-label">Customers</span>
          </button>
          <button class="nav-item" data-view="groups">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
            </span>
            <span class="nav-label">Groups & Itinerary</span>
          </button>
          <button class="nav-item" data-view="hotels">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>
            </span>
            <span class="nav-label">Hotels & Rooms</span>
          </button>
          <button class="nav-item" data-view="flights">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
            </span>
            <span class="nav-label">Flights & Transport</span>
          </button>
          <button class="nav-item" data-view="invoices">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </span>
            <span class="nav-label">Invoices & Receipts</span>
          </button>
          <button class="nav-item" data-view="expenses">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>
            </span>
            <span class="nav-label">Expenses & Finance</span>
          </button>
          <button class="nav-item" data-view="reports">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>
            </span>
            <span class="nav-label">Reports & Analytics</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="credits">
            <span>Amja Travels CRM v1.0</span>
          </div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Main Top Header -->
        <header class="main-header">
          <div class="header-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Welcome back! Here's the current overview of Amja Travels.</p>
          </div>
          <div class="header-actions">
            <div class="quick-add-dropdown">
              <button class="btn btn-primary" id="btn-quick-add">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Quick Actions
              </button>
              <div class="dropdown-content" id="quick-add-menu">
                <a href="#" data-action="new-customer">Add New Customer</a>
                <a href="#" data-action="new-group">Create Travel Group</a>
                <a href="#" data-action="new-expense">Record Expense</a>
              </div>
            </div>
          </div>
        </header>

        <!-- Dynamic Panels (Toggled via CSS/JS) -->
        <div class="panel-container">
          
          <!-- DASHBOARD PANEL -->
          <section id="panel-dashboard" class="view-panel active">
            <!-- Loading indicator/Dashboard Content will be injected dynamically -->
          </section>

          <!-- CUSTOMERS PANEL -->
          <section id="panel-customers" class="view-panel">
            <!-- Content will be injected dynamically -->
          </section>

          <!-- GROUPS PANEL -->
          <section id="panel-groups" class="view-panel">
            <!-- Content will be injected dynamically -->
          </section>

          <!-- HOTELS PANEL -->
          <section id="panel-hotels" class="view-panel">
            <!-- Content will be injected dynamically -->
          </section>

          <!-- FLIGHTS PANEL -->
          <section id="panel-flights" class="view-panel">
            <!-- Content will be injected dynamically -->
          </section>

          <!-- INVOICES PANEL -->
          <section id="panel-invoices" class="view-panel">
            <!-- Content will be injected dynamically -->
          </section>

          <!-- EXPENSES PANEL -->
          <section id="panel-expenses" class="view-panel">
            <!-- Content will be injected dynamically -->
          </section>

          <!-- REPORTS PANEL -->
          <section id="panel-reports" class="view-panel">
            <!-- Content will be injected dynamically -->
          </section>
        </div>
      </main>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- JS Entry Point -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
